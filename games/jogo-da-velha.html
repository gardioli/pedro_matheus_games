<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha - Hub de Jogos</title>
    <link rel="stylesheet" href="../css/jogo-da-velha.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    </style>
</head>
<body>
    <div class="page-wrapper">

        <!-- Top bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Hub</a>
                <h1 class="panel-title"><i class="fa-solid fa-gamepad" style="color: var(--accent-color); font-size: 0.85em;"></i> Jogo da Velha</h1>
            </div>
            <div class="score-board">
                <div class="score-item">
                    <div style="color: var(--x-color);"><span id="iconX" class="score-char"></span><span id="labelX">Mario</span></div>
                    <div id="scoreX" class="score-val">0</div>
                </div>
                <div style="color: var(--border-color); font-size: 1.5rem; line-height: 1;">|</div>
                <div class="score-item">
                    <div style="color: var(--o-color);"><span id="iconO" class="score-char"></span><span id="labelO">Luigi</span></div>
                    <div id="scoreO" class="score-val">0</div>
                </div>
                <div style="color: var(--border-color); font-size: 1.5rem; line-height: 1;">|</div>
                <div class="score-item">
                    <div style="color: #f59e0b;">Empates</div>
                    <div id="scoreDraw" class="score-val">0</div>
                </div>
            </div>
        </div>

        <!-- Main layout -->
        <div class="main-layout">

            <!-- Left: controls -->
            <div class="left-panel">
                <div id="status">Vez do <span id="turnLabel" style="color: var(--x-color); font-weight: bold;">Mario</span></div>

                <hr class="divider">

                <div class="mode-selector">
                    <button onclick="setMode(false)" id="btn2p" class="btn active">
                        <i class="fa-solid fa-users"></i> 2 Jogadores
                    </button>
                    <button onclick="setMode(true)" id="btnAI" class="btn">
                        <i class="fa-solid fa-robot"></i> Computador
                    </button>
                </div>

                <div id="difficulty-selector" class="difficulty-selector">
                    <button onclick="setDifficulty('facil')" id="btnFacil" class="btn">Fácil</button>
                    <button onclick="setDifficulty('medio')" id="btnMedio" class="btn active">Médio</button>
                    <button onclick="setDifficulty('dificil')" id="btnDificil" class="btn">Difícil</button>
                </div>

                <hr class="divider">

                <div class="actions">
                    <button onclick="resetGame()" class="btn">
                        <i class="fa-solid fa-redo"></i> Reiniciar
                    </button>
                    <button onclick="resetScores()" class="btn">
                        <i class="fa-solid fa-trash"></i> Limpar
                    </button>
                </div>
            </div>

            <!-- Right: board -->
            <div class="board-panel">
                <div id="game-theme-container" class="grid-container theme-mario-luigi">
                    <div id="board" class="grid"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="../js/jogo-da-velha.js"></script>
</body>
</html>
